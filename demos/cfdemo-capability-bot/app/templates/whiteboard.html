<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MyCapact — Whiteboard</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #f4f6f8;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      background: #1a73e8;
      color: #fff;
      padding: 16px 24px;
      font-size: 1.25rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }
    header span.dot {
      width: 10px; height: 10px;
      background: #34d399;
      border-radius: 50%;
      display: inline-block;
    }
    .whiteboard { flex: 1; padding: 32px; overflow-y: auto; }
    .whiteboard-content {
      background: #fff;
      border-radius: 12px;
      padding: 32px;
      min-height: 200px;
      font-size: 1.35rem;
      line-height: 1.8;
      white-space: pre-wrap;
      word-break: break-word;
      color: #1f2937;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }
    .whiteboard-content.empty { color: #9ca3af; font-style: italic; }
    .input-bar {
      display: flex;
      gap: 12px;
      padding: 16px 24px;
      background: #fff;
      border-top: 1px solid #e5e7eb;
    }
    .input-bar input {
      flex: 1;
      padding: 12px 16px;
      font-size: 1rem;
      border: 2px solid #d1d5db;
      border-radius: 8px;
      outline: none;
      transition: border-color 0.2s;
    }
    .input-bar input:focus { border-color: #1a73e8; }
    .input-bar button {
      padding: 12px 28px;
      font-size: 1rem;
      font-weight: 600;
      background: #1a73e8;
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .input-bar button:hover { background: #1557b0; }
  </style>
</head>
<body>
  <header>
    <span class="dot"></span>
    MyCapact Whiteboard
  </header>
  <div class="whiteboard">
    <div id="content" class="whiteboard-content empty">Whiteboard is empty — send a message via the input below or use the API.</div>
  </div>
  <div class="input-bar">
    <input id="msgInput" type="text" placeholder="Type your message and press Send..." />
    <button id="sendBtn" onclick="sendMessage()">Send</button>
  </div>
  <script>
    const contentEl = document.getElementById('content');
    const inputEl   = document.getElementById('msgInput');

    async function fetchMessage() {
      try {
        const res = await fetch('/api/message');
        const data = await res.json();
        if (data.text && data.text.trim() !== '') {
          contentEl.textContent = data.text;
          contentEl.classList.remove('empty');
        } else {
          contentEl.textContent = 'Whiteboard is empty — send a message via the input below or use the API.';
          contentEl.classList.add('empty');
        }
      } catch (err) {
        console.error('Failed to fetch message:', err);
      }
    }

    async function sendMessage() {
      const text = inputEl.value.trim();
      if (!text) return;
      try {
        await fetch('/api/message', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text })
        });
        inputEl.value = '';
        fetchMessage();
      } catch (err) {
        console.error('Failed to send message:', err);
      }
    }

    inputEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') sendMessage();
    });

    fetchMessage();
    setInterval(fetchMessage, 3000);
  </script>
</body>
</html>
