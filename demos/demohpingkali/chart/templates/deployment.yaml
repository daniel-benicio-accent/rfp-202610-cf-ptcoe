apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "hping-site.labels" . | nindent 4 }}
spec:
  # No replicas field: the HPA owns the count. Setting one here would snap the
  # count back to it on every upgrade.
  selector:
    matchLabels:
      {{- include "hping-site.selectorLabels" . | nindent 6 }}
  # Surge first, never drop below the current count, so the page never loses
  # capacity during a rollout. Pods may now share a node, so the surge pod can
  # usually start on an existing node instead of waiting on the autoscaler.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        {{- include "hping-site.selectorLabels" . | nindent 8 }}
        # Injection by pod label, so the namespace needs no Istio label and
        # can be created by Helm.
        sidecar.istio.io/inject: "true"
      annotations:
        # Rolls the pods when default.conf changes; a subPath mount never
        # picks up a ConfigMap edit by itself.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        # Same for the environment, which is read only at container start.
        checksum/env: {{ include (print $.Template.BasePath "/configmap-env.yaml") . | sha256sum }}
    spec:
      # No pod anti-affinity: pods may share a node, but the count per node is
      # kept even — a hard rule at schedule time (the hostname spread below), and
      # corrected afterwards for drift (e.g. once the autoscaler adds a node) by
      # the descheduler CronJob (descheduler.tf).
      topologySpreadConstraints:
        # Balance the pod count across nodes, as a hard rule: no node may hold
        # more than one pod above the emptiest (maxSkew 1). If no node can take a
        # pod without breaking that, the pod stays Pending and the cluster
        # autoscaler adds a node. matchLabelKeys scopes the count to a single
        # ReplicaSet (by pod-template-hash), so during a rollout the old and new
        # pods are counted apart and the surge pod never deadlocks against them.
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              {{- include "hping-site.selectorLabels" . | nindent 14 }}
          matchLabelKeys:
            - pod-template-hash
        # And spread over zones as evenly as the nodes allow.
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "hping-site.selectorLabels" . | nindent 14 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: hping
          image: {{ .Values.image }}
          {{- with .Values.command }}
          # Replaces the image's ENTRYPOINT; the image's CMD is dropped too.
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          # Every key of env in values.yaml, as an environment variable.
          envFrom:
            - configMapRef:
                name: "{{ .Release.Name }}-env"
          ports:
            - name: http
              containerPort: 80
          # HTTP probes only with the image's own entrypoint. A command from
          # values runs instead of the server, so nothing answers on port 80:
          # the pod would never turn Ready, the liveness probe would restart it
          # every 30 seconds, and the Helm release would time out waiting.
          {{- if not .Values.command }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          {{- end }}
          # Gives the gateway time to stop routing here before hping exits,
          # so scale-down and node drains drop no requests.
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: {{ .Release.Name }}
